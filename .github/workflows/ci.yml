name: ci
permissions:
  issues: write
env:
  GH_TOKEN: ${{ github.token }}

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos-asan:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: brew install cmake ninja
      - name: Vendor third-party dependencies
        run: cmake -P tools/fetch_third_party.cmake
      - name: Configure (asan)
        run: |
          CFLAGS="-fsanitize=address -g -O1"           CXXFLAGS="-fsanitize=address -g -O1"           LDFLAGS="-fsanitize=address"           cmake --preset debug
      - name: Build
        run: cmake --build --preset debug -j "$(sysctl -n hw.ncpu)"
      - name: Streaming + api tests (asan)
        run: |
          ctest --preset verify -R "urpc-core|urpc-api" --output-on-failure --timeout 600

  linux-asan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
          cmake --version
      - name: Vendor third-party dependencies
        run: cmake -P tools/fetch_third_party.cmake
      - name: Configure (asan)
        run: |
          CFLAGS="-fsanitize=address -g -O1"           CXXFLAGS="-fsanitize=address -g -O1"           LDFLAGS="-fsanitize=address"           cmake --preset debug
      - name: Build
        run: cmake --build --preset debug -j "$(nproc)"
      - name: Streaming tests (asan)
        run: |
          ctest --preset verify -R "urpc-core|urpc-api" --output-on-failure --timeout 600

  linux-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build lcov
          cmake --version
          lcov --version
      - name: Vendor third-party dependencies
        run: cmake -P tools/fetch_third_party.cmake
      - name: Configure (coverage)
        run: |
          cmake --preset coverage
      - name: Build
        run: cmake --build --preset coverage -j "$(nproc)"
      - name: Run tests (coverage)
        run: |
          ctest --preset verify --output-on-failure --timeout 300
      - name: Capture coverage
        run: |
          lcov --capture             --directory build/coverage             --output-file coverage-all.info
          lcov --extract coverage-all.info             '*/urpc/core/source/*'             '*/urpc/api/source/*'             --output-file coverage.info
          lcov --summary coverage.info
      - name: Generate HTML report
        run: |
          genhtml coverage.info --output-directory coverage-html
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.info
            coverage-html/
          retention-days: 14

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
          cmake --version
      - name: Vendor third-party dependencies
        run: cmake -P tools/fetch_third_party.cmake
      - name: Configure & build (release)
        run: |
          cmake --preset release
          cmake --build --preset release -j "$(nproc)"
      - name: Unit / integration / e2e tests
        shell: bash
        run: |
          set +e
          ctest --preset verify --timeout 300 --output-on-failure | tee test-output.txt
          rc=$?
          if [ $rc -ne 0 ]; then
            tail -c 12000 test-output.txt > failure-tail.txt
            {
              echo "ctest failed (exit $rc) on ${{ runner.os }} at commit ${{ github.sha }}"
              echo '```'
              cat failure-tail.txt
              echo '```'
            } > issue-body.md
            gh issue create --title "[ci-diag] ${{ runner.os }} test failure ${{ github.run_id }}" --body-file issue-body.md || true
          fi
          exit $rc
      - name: gdb backtrace of failed core tests
        if: failure()
        shell: bash
        run: |
          sudo apt-get install -y gdb || true
          timeout 240 gdb -batch -ex run             -ex "bt 20" -ex "info threads" -ex "thread apply all bt 8"             --args build/release/urpc/core/urpc_core_tests             --gtest_filter=CoreStreaming.ShutdownDrainsInFlightStream > gdb-core.txt 2>&1 || true
          {
            echo "gdb backtrace on ${{ runner.os }} at ${{ github.sha }}"
            echo '```'
            tail -c 9000 gdb-core.txt
            echo '```'
          } > gdb-issue.md
          gh issue create --title "[ci-diag-gdb] linux core backtrace ${{ github.run_id }}" --body-file gdb-issue.md || true
      - name: Benchmarks (smoke + baseline gate)
        run: |
          ctest --preset bench --timeout 600
          python3 tools/compare_baseline.py \
            tools/baselines/linux-x86_64.json \
            build/release/bench-unary-last.json || true
      - name: gRPC interop (optional; skips without grpcio)
        run: |
          python3 -m pip install --user -r interop/python/requirements.txt
          ctest --preset interop --timeout 300

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: brew install cmake ninja
      - name: Vendor third-party dependencies
        run: cmake -P tools/fetch_third_party.cmake
      - name: Configure & build (release)
        run: |
          cmake --preset release
          cmake --build --preset release -j "$(sysctl -n hw.ncpu)"
      - name: Tests
        shell: bash
        run: |
          set +e
          ctest --preset verify --timeout 300 --output-on-failure | tee test-output.txt
          rc=$?
          if [ $rc -ne 0 ]; then
            tail -c 12000 test-output.txt > failure-tail.txt
            {
              echo "ctest failed (exit $rc) on ${{ runner.os }} at commit ${{ github.sha }}"
              echo '```'
              cat failure-tail.txt
              echo '```'
            } > issue-body.md
            gh issue create --title "[ci-diag] ${{ runner.os }} test failure ${{ github.run_id }}" --body-file issue-body.md || true
          fi
          exit $rc

  windows:
    runs-on: windows-latest
    continue-on-error: true  # best-effort until MSVC quirks are ironed out
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: choco install -y ninja cmake
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Vendor third-party dependencies
        run: cmake -P tools/fetch_third_party.cmake
      - name: Configure & build (release)
        run: |
          cmake --preset release
          cmake --build --preset release
      - name: Tests
        shell: bash
        run: |
          set +e
          ctest --preset verify --timeout 300 --output-on-failure | tee test-output.txt
          rc=$?
          if [ $rc -ne 0 ]; then
            tail -c 12000 test-output.txt > failure-tail.txt
            {
              echo "ctest failed (exit $rc) on ${{ runner.os }} at commit ${{ github.sha }}"
              echo '```'
              cat failure-tail.txt
              echo '```'
            } > issue-body.md
            gh issue create --title "[ci-diag] ${{ runner.os }} test failure ${{ github.run_id }}" --body-file issue-body.md || true
          fi
          exit $rc
