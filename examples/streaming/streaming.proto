// Streaming example (spec 004): one service exercising all three
// streaming forms alongside the wire-compatible unary baseline.
syntax = "proto3";
package example;

message RangeRequest {
  uint32 count = 1;     // number of values to stream back (0..1000)
  uint32 status_every = 2; // if >0: end the stream with INTERNAL after
                           // every N-th value (error-path demo)
}

message RangeValue {
  uint32 value = 1;
}

message AddRequest {
  int64 value = 1;
}

message TotalResponse {
  int64 total = 1;
  uint32 count = 2;
}

message ChatMsg {
  string text = 1;
  uint32 seq = 2;
}

service StreamService {
  // server streaming: single request -> stream of values 0..count-1
  rpc Range(RangeRequest) returns (stream RangeValue);
  // client streaming: stream of values -> single total
  rpc Sum(stream AddRequest) returns (TotalResponse);
  // bidirectional streaming: echo every message back with its seq
  rpc Chat(stream ChatMsg) returns (stream ChatMsg);
}
